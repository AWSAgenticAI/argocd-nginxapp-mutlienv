apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-cert
  template:
    metadata:
      labels:
        app: nginx-cert
    spec:
      containers:
      - name: nginx-cert
        image: nginx
        ports:
        - containerPort: 8080
